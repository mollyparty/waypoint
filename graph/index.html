<!DOCTYPE html>
<html lang="en">

<head>

<title>Waypoint Knowledge Graph</title>
<script src="https://unpkg.com/force-graph@1.47.2/dist/force-graph.min.js"></script>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121a23;
    --panel2: #0e141b;
    --border: #22303e;
    --text: #e8eef4;
    --muted: #8b98a5;
    --accent: #4ea1ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  #graph { position: absolute; inset: 0; }

  /* ---------- Left panel ---------- */
  .panel {
    position: absolute; top: 16px; left: 16px; width: 300px; max-height: calc(100vh - 32px);
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    display: flex; flex-direction: column; z-index: 10;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  .panel-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
  .panel-head h1 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  .panel-head p { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .panel-head a { color: var(--accent); text-decoration: none; }
  .search-wrap { padding: 12px 16px; border-bottom: 1px solid var(--border); position: relative; }
  #search {
    width: 100%; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 13.5px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #results {
    position: absolute; left: 16px; right: 16px; top: 56px; z-index: 20;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 9px;
    max-height: 260px; overflow-y: auto; display: none;
  }
  #results div { padding: 8px 12px; cursor: pointer; font-size: 12.5px; border-bottom: 1px solid var(--border); }
  #results div:last-child { border-bottom: none; }
  #results div:hover { background: rgba(78,161,255,.12); }
  .legend { overflow-y: auto; padding: 10px 8px 12px; }
  .legend-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); padding: 4px 10px 8px; display: flex; justify-content: space-between; align-items: center; }
  .legend-title button { background: none; border: none; color: var(--accent); font-size: 11px; cursor: pointer; }
  .leg-item {
    display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: 8px;
    cursor: pointer; user-select: none;
  }
  .leg-item:hover { background: rgba(255,255,255,.05); }
  .leg-item.off { opacity: .32; }
  .leg-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .leg-label { font-size: 12.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leg-count { font-size: 11px; color: var(--muted); }
  .panel-foot { border-top: 1px solid var(--border); padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 11px; font-size: 12px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.toggled { border-color: var(--accent); color: var(--accent); }
  #stats { font-size: 11px; color: var(--muted); width: 100%; }

  /* ---------- Detail panel ---------- */
  .detail {
    position: absolute; top: 16px; right: 16px; width: 340px; max-height: calc(100vh - 32px);
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    z-index: 10; display: none; flex-direction: column;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  .detail.open { display: flex; }
  .detail-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); position: relative; }
  .detail-head .d-comm { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 4px; }
  .detail-head h2 { font-size: 15px; line-height: 1.45; padding-right: 26px; }
  .detail-close {
    position: absolute; top: 12px; right: 12px; background: none; border: none;
    color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1;
  }
  .detail-close:hover { color: var(--text); }
  .detail-body { padding: 12px 18px 16px; overflow-y: auto; }
  .d-row { margin-bottom: 12px; }
  .d-lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .d-val { font-size: 12.5px; line-height: 1.55; color: var(--text); word-break: break-word; }
  .d-val.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--muted); }
  .conn {
    display: flex; align-items: baseline; gap: 7px; padding: 6px 9px; border-radius: 7px;
    cursor: pointer; margin-bottom: 2px;
  }
  .conn:hover { background: rgba(78,161,255,.1); }
  .conn .rel { font-size: 10.5px; color: var(--muted); font-style: italic; white-space: nowrap; }
  .conn .who { font-size: 12px; flex: 1; }

  .hint {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 11.5px; z-index: 5; background: rgba(11,15,20,.75);
    padding: 5px 14px; border-radius: 99px; pointer-events: none;
  }
  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); z-index: 30; background: var(--bg); flex-direction: column; gap: 8px; text-align: center; padding: 20px;
  }
  @media (max-width: 900px) {
    .panel { width: calc(100vw - 32px); max-height: 45vh; }
    .detail { width: calc(100vw - 32px); top: auto; bottom: 16px; max-height: 45vh; }
  }
</style>
</head>
<body>

<div id="loading">Loading the knowledge graph...</div>
<div id="graph"></div>

<div class="panel">
  <div class="panel-head">
    <h1>Waypoint Knowledge Graph</h1>
    <p>Everything the project knows and how it connects. <a href="/">Back to artifacts</a></p>
  </div>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="Search nodes (decisions, findings, docs)..." autocomplete="off">
    <div id="results"></div>
  </div>
  <div class="legend">
    <div class="legend-title"><span>Topic clusters</span><button id="all-btn">show all</button></div>
    <div id="legend-items"></div>
  </div>
  <div class="panel-foot">
    <button class="btn" id="fit-btn">Fit view</button>
    <button class="btn toggled" id="labels-btn">Labels</button>
    <button class="btn" id="tech-btn">Show config nodes</button>
    <div id="stats"></div>
  </div>
</div>

<div class="detail" id="detail">
  <div class="detail-head">
    <div class="d-comm" id="d-comm"></div>
    <h2 id="d-title"></h2>
    <button class="detail-close" id="d-close">&times;</button>
  </div>
  <div class="detail-body">
    <div class="d-row" id="d-rationale-row"><div class="d-lbl">Why this matters</div><div class="d-val" id="d-rationale"></div></div>
    <div class="d-row"><div class="d-lbl">Source file</div><div class="d-val mono" id="d-source"></div></div>
    <div class="d-row"><div class="d-lbl">Connections</div><div id="d-conns"></div></div>
  </div>
</div>

<div class="hint">Click a node for details · drag to explore · scroll to zoom</div>

<script>
const PALETTE = ['#4ea1ff','#5cd682','#f5a623','#ef6b73','#b98cf5','#43cfc0','#f27fb2','#c9d34e','#8fa4ff','#f2915c','#6fd3f2','#d9a8f0'];
const CURATED = {
  // Community labels are computed from members, but these keyword rules give friendlier names.
  rules: [
    [/dec-?00\d|decision/i, null], // placeholder, names resolved below
  ]
};

function communityName(members) {
  // Prefer the phase/topic implied by the most connected member labels.
  const joined = members.map(m => m.label).join(' | ').toLowerCase();
  const tests = [
    [/mvp|rice|prd|stack|user journey|product definition/, 'Product and MVP'],
    [/strava|runna|komoot|alltrails|competitor|threat/, 'Competitive landscape'],
    [/persona|segment|pain point|jobs-to-be-done|unmet need|user research/, 'Users and needs'],
    [/concept lock|positioning|tagline|know where to run/, 'Concept and positioning'],
    [/market|tam|sizing|regulatory|compliance|industry trend|whitespace/, 'Market and compliance'],
    [/founder brief|playbook|research program|phase|dashboard|gate/, 'Research program'],
    [/versioning|commit|changelog|semantic|trunk|attribution/, 'Versioning and git'],
    [/agent protocol|claude|contributing|cross-ide|line-ending|push policy/, 'Agent and collaboration setup'],
    [/obsidian|vault|template|start here|session-end|retrieval|graphify|token|memory/, 'Memory system'],
    [/app\.json|\.obsidian/, 'Tool configuration'],
  ];
  for (const [re, name] of tests) if (re.test(joined)) return name;
  // Fallback: highest-degree member label, trimmed.
  const top = members.slice().sort((a,b) => (b._deg||0)-(a._deg||0))[0];
  return top ? top.label.replace(/\(.*?\)/g,'').trim().slice(0, 34) : 'Cluster';
}

const state = { hiddenComms: new Set(), showTech: false, showLabels: true, selected: null, hover: null };
let Graph, DATA, commMeta = new Map();

async function load() {
  let raw;
  try {
    const res = await fetch('../graphify-out/graph.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    raw = await res.json();
  } catch (e) {
    document.getElementById('loading').innerHTML =
      'Could not load graph.json.<br><span style="font-size:12px">If you opened this file directly from disk, serve the repo over http instead (on Vercel this loads automatically).</span>';
    return;
  }

  const nodes = raw.nodes.map(n => ({ ...n }));
  const links = raw.links.map(l => ({ ...l }));
  const byId = new Map(nodes.map(n => [n.id, n]));
  links.forEach(l => {
    const s = byId.get(typeof l.source === 'object' ? l.source.id : l.source);
    const t = byId.get(typeof l.target === 'object' ? l.target.id : l.target);
    if (s) s._deg = (s._deg || 0) + 1;
    if (t) t._deg = (t._deg || 0) + 1;
  });
  nodes.forEach(n => { n._tech = (n.source_file || '').includes('.obsidian') || n.file_type === 'code' && /\.json/.test(n.source_file || ''); });

  // Community metadata
  const groups = new Map();
  nodes.forEach(n => {
    const c = n.community ?? -1;
    if (!groups.has(c)) groups.set(c, []);
    groups.get(c).push(n);
  });
  [...groups.entries()].sort((a,b) => b[1].length - a[1].length).forEach(([c, members], i) => {
    commMeta.set(c, { color: PALETTE[i % PALETTE.length], name: communityName(members), count: members.length });
  });

  DATA = { nodes, links };
  buildLegend();
  buildGraph();
  document.getElementById('loading').remove();
}

function visibleData() {
  const nodes = DATA.nodes.filter(n =>
    !state.hiddenComms.has(n.community ?? -1) && (state.showTech || !n._tech));
  const ids = new Set(nodes.map(n => n.id));
  const links = DATA.links.filter(l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    return ids.has(s) && ids.has(t);
  });
  document.getElementById('stats').textContent = `${nodes.length} nodes · ${links.length} connections · built at ${ (DATA.builtAt||'latest commit') }`;
  return { nodes, links };
}

function neighborsOf(node) {
  const set = new Set([node.id]);
  DATA.links.forEach(l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    if (s === node.id) set.add(t);
    if (t === node.id) set.add(s);
  });
  return set;
}

function buildGraph() {
  const el = document.getElementById('graph');
  Graph = ForceGraph()(el)
    .graphData(visibleData())
    .backgroundColor('#0b0f14')
    .nodeId('id')
    .nodeVal(n => 2 + Math.min(n._deg || 1, 30) * 0.6)
    .nodeLabel(() => null)
    .nodeCanvasObjectMode(() => 'after')
    .nodeCanvasObject((n, ctx, scale) => {
      const focus = state.selected || state.hover;
      const dimmed = focus && !focus._nbrs.has(n.id);
      if (!state.showLabels && !(focus && focus._nbrs.has(n.id))) return;
      if (dimmed) return;
      const importance = (n._deg || 1);
      const threshold = focus ? 0 : Math.max(0, 14 - importance * 1.4);
      if (scale < 1 + threshold * 0.28) return;
      const label = n.label.length > 46 ? n.label.slice(0, 44) + '...' : n.label;
      const size = Math.max(11 / scale, 2.4);
      ctx.font = `${size}px -apple-system, "Segoe UI", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(232,238,244,.92)';
      ctx.fillText(label, n.x, n.y + 5 + Math.min(n._deg||1,30)*0.25);
    })
    .nodeColor(n => {
      const focus = state.selected || state.hover;
      const base = (commMeta.get(n.community ?? -1) || {}).color || '#888';
      if (!focus) return base;
      return focus._nbrs.has(n.id) ? base : 'rgba(120,130,140,.13)';
    })
    .linkColor(l => {
      const focus = state.selected || state.hover;
      if (!focus) return 'rgba(140,155,170,.18)';
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      return (s === focus.id || t === focus.id) ? 'rgba(78,161,255,.65)' : 'rgba(120,130,140,.05)';
    })
    .linkWidth(l => {
      const focus = state.selected || state.hover;
      if (!focus) return 1;
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      return (s === focus.id || t === focus.id) ? 2 : 0.5;
    })
    .linkDirectionalParticles(l => {
      const focus = state.selected;
      if (!focus) return 0;
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      return (s === focus.id || t === focus.id) ? 2 : 0;
    })
    .linkDirectionalParticleWidth(2)
    .onNodeHover(n => {
      if (n) { n._nbrs = neighborsOf(n); state.hover = n; }
      else state.hover = null;
      el.style.cursor = n ? 'pointer' : 'default';
    })
    .onNodeClick(n => select(n))
    .onBackgroundClick(() => { state.selected = null; closeDetail(); })
    .cooldownTicks(160);
  Graph.d3Force('charge').strength(-90);
  setTimeout(() => Graph.zoomToFit(600, 60), 900);
}

function select(n, recenter = false) {
  n._nbrs = neighborsOf(n);
  state.selected = n;
  openDetail(n);
  if (recenter) { Graph.centerAt(n.x, n.y, 600); Graph.zoom(3.2, 600); }
}

function openDetail(n) {
  const meta = commMeta.get(n.community ?? -1) || { name: 'Cluster', color: '#888' };
  document.getElementById('d-comm').textContent = meta.name;
  document.getElementById('d-comm').style.color = meta.color;
  document.getElementById('d-title').textContent = n.label;
  const rat = document.getElementById('d-rationale-row');
  if (n.rationale) { rat.style.display = ''; document.getElementById('d-rationale').textContent = n.rationale; }
  else rat.style.display = 'none';
  document.getElementById('d-source').textContent = n.source_file || 'unknown';
  const wrap = document.getElementById('d-conns');
  wrap.innerHTML = '';
  const conns = [];
  DATA.links.forEach(l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    if (s === n.id) conns.push({ rel: l.relation + ' →', otherId: t });
    else if (t === n.id) conns.push({ rel: '← ' + l.relation, otherId: s });
  });
  const byId = new Map(DATA.nodes.map(x => [x.id, x]));
  conns.slice(0, 40).forEach(c => {
    const other = byId.get(c.otherId);
    if (!other) return;
    const div = document.createElement('div');
    div.className = 'conn';
    div.innerHTML = `<span class="rel">${c.rel}</span><span class="who">${other.label}</span>`;
    div.onclick = () => select(other, true);
    wrap.appendChild(div);
  });
  document.getElementById('detail').classList.add('open');
}

function closeDetail() { document.getElementById('detail').classList.remove('open'); }
document.getElementById('d-close').onclick = () => { state.selected = null; closeDetail(); };

function buildLegend() {
  const wrap = document.getElementById('legend-items');
  wrap.innerHTML = '';
  [...commMeta.entries()].sort((a,b) => b[1].count - a[1].count).forEach(([c, meta]) => {
    const div = document.createElement('div');
    div.className = 'leg-item';
    div.innerHTML = `<span class="leg-dot" style="background:${meta.color}"></span>
      <span class="leg-label">${meta.name}</span><span class="leg-count">${meta.count}</span>`;
    div.onclick = () => {
      if (state.hiddenComms.has(c)) state.hiddenComms.delete(c); else state.hiddenComms.add(c);
      div.classList.toggle('off', state.hiddenComms.has(c));
      Graph.graphData(visibleData());
    };
    wrap.appendChild(div);
  });
}

document.getElementById('all-btn').onclick = () => {
  state.hiddenComms.clear();
  document.querySelectorAll('.leg-item').forEach(d => d.classList.remove('off'));
  Graph.graphData(visibleData());
};
document.getElementById('fit-btn').onclick = () => Graph.zoomToFit(600, 60);
document.getElementById('labels-btn').onclick = e => {
  state.showLabels = !state.showLabels;
  e.target.classList.toggle('toggled', state.showLabels);
};
document.getElementById('tech-btn').onclick = e => {
  state.showTech = !state.showTech;
  e.target.classList.toggle('toggled', state.showTech);
  Graph.graphData(visibleData());
};

// Search
const searchEl = document.getElementById('search');
const resultsEl = document.getElementById('results');
searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  resultsEl.innerHTML = '';
  if (q.length < 2) { resultsEl.style.display = 'none'; return; }
  const hits = DATA.nodes.filter(n => n.label.toLowerCase().includes(q) ||
    (n.rationale || '').toLowerCase().includes(q)).slice(0, 12);
  hits.forEach(n => {
    const div = document.createElement('div');
    div.textContent = n.label;
    div.onclick = () => {
      resultsEl.style.display = 'none';
      searchEl.value = n.label;
      if (!state.showTech && n._tech) { state.showTech = true; document.getElementById('tech-btn').classList.add('toggled'); Graph.graphData(visibleData()); }
      if (state.hiddenComms.has(n.community ?? -1)) { state.hiddenComms.delete(n.community ?? -1); buildLegend(); Graph.graphData(visibleData()); }
      setTimeout(() => select(DATA.nodes.find(x => x.id === n.id), true), 150);
    };
    resultsEl.appendChild(div);
  });
  resultsEl.style.display = hits.length ? 'block' : 'none';
});
document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) resultsEl.style.display = 'none'; });

load();
</script>
</body>
</html>
